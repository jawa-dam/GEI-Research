name: Deploy GEI Research Interface
on:
  push:
    branches: [main]
    paths:
      - 'interface/**'
      - 'data/**'
      - 'schema/**'
      - 'validation/**'
      - '.github/workflows/deploy-research-interface.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    name: Verify interface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install jsonschema
      - name: Validate canonical dataset
        run: python validation/validate.py
      - name: Verify V1.0.11 outcome intelligence layer
        run: |
          test -f interface/index.html
          test -f interface/styles.css
          test -f interface/app.js
          test -f interface/investigation.js
          test -f interface/decision-engine.js
          test -f interface/outcome-engine.js
          test -f schema/evaluation.schema.json
          test -f data/evaluations/EVA-GEI-GEN1-001.json
          grep -q 'outcome-engine.js' interface/index.html
          grep -q 'Outcome Intelligence' interface/outcome-engine.js
          grep -q 'expected_state' interface/outcome-engine.js
          grep -q 'observed_state' interface/outcome-engine.js
          grep -q 'revision_recommendation' interface/outcome-engine.js
          python - <<'PY'
          import pathlib,re,json
          html=pathlib.Path('interface/index.html').read_text(encoding='utf-8')
          js=pathlib.Path('interface/app.js').read_text(encoding='utf-8')
          out=pathlib.Path('interface/outcome-engine.js').read_text(encoding='utf-8')
          required=['explorerView','timelineView','comparisonsView','epistemicView','graphView','intelligenceView','investigationsView','decisionsView','recordDialog']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit(f'Missing interface elements: {missing}')
          if 'outcome-engine.js' not in html: raise SystemExit('Outcome engine script is not connected')
          m=re.search(r"const CATEGORIES=\[(.*?)\];",js,re.S)
          if not m: raise SystemExit('Could not find dataset category registry in app.js')
          cats=re.findall(r"'([^']+)'",m.group(1))
          required_dirs=set(cats)|{'questions','claims','investigations','results','outcomes','evaluations','decisions','executions','observations'}
          missing_dirs=[c for c in sorted(required_dirs) if not pathlib.Path('data',c).is_dir()]
          if missing_dirs: raise SystemExit(f'Missing canonical data directories: {missing_dirs}')
          for f in ['question.schema.json','claim.schema.json','investigation.schema.json','result.schema.json','outcome.schema.json','decision.schema.json','execution.schema.json','observation.schema.json','evaluation.schema.json']:
              if not pathlib.Path('schema',f).is_file(): raise SystemExit(f'Missing schema: {f}')
          for token in ['outcome_ids','result_ids','hypothesis_ids','assessment','expected_state','observed_state','delta','revision_recommendation']:
              if token not in out: raise SystemExit(f'Missing outcome intelligence field: {token}')
          print(f'V1.0.11 verification passed: outcome evaluation layer connected across {len(required_dirs)} canonical data directories.')
          PY
  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -R interface/. _site/
          touch _site/.nojekyll
          printf '%s\n' 'GEI Research Interface V1.0.11' > _site/DEPLOYMENT-VERSION.txt
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
