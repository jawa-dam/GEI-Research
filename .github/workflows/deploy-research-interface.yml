name: Deploy GEI Research Interface
on:
  push:
    branches: [main]
    paths:
      - 'interface/**'
      - 'data/**'
      - 'schema/**'
      - 'validation/**'
      - '.github/workflows/deploy-research-interface.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    name: Verify interface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install jsonschema
      - name: Validate canonical dataset
        run: python validation/validate.py
      - name: Verify V1.0.9 interface and investigation layer
        run: |
          test -f interface/index.html
          test -f interface/styles.css
          test -f interface/app.js
          test -f interface/investigation.js
          grep -q 'investigation.js' interface/index.html
          grep -q 'graphView' interface/index.html
          grep -q 'intelligenceView' interface/index.html
          grep -q 'investigation' interface/investigation.js
          grep -q 'alternative_explanation' interface/investigation.js
          grep -q 'test_plan' interface/investigation.js
          python - <<'PY'
          import pathlib,re
          html=pathlib.Path('interface/index.html').read_text(encoding='utf-8')
          js=pathlib.Path('interface/app.js').read_text(encoding='utf-8')
          inv=pathlib.Path('interface/investigation.js').read_text(encoding='utf-8')
          required=['explorerView','timelineView','comparisonsView','epistemicView','graphView','intelligenceView','researchGraph','relationshipTable','claimTrace','auditList','recordDialog']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit(f'Missing interface elements: {missing}')
          m=re.search(r"const CATEGORIES=\[(.*?)\];",js,re.S)
          if not m: raise SystemExit('Could not find dataset category registry in app.js')
          cats=re.findall(r"'([^']+)'",m.group(1))
          missing_dirs=[c for c in cats if not pathlib.Path('data',c).is_dir()]
          missing_dirs += [c for c in ['questions','claims','investigations','results','outcomes'] if not pathlib.Path('data',c).is_dir()]
          if missing_dirs: raise SystemExit(f'Missing canonical data directories: {sorted(set(missing_dirs))}')
          for f in ['question.schema.json','claim.schema.json','investigation.schema.json','result.schema.json','outcome.schema.json']:
              if not pathlib.Path('schema',f).is_file(): raise SystemExit(f'Missing schema: {f}')
          for token in ['question_ids','claim_ids','hypothesis_ids','counterevidence_ids','result_ids','outcome_ids']:
              if token not in inv: raise SystemExit(f'Missing investigation trace field in interface: {token}')
          print(f'V1.0.9 verification passed: {len(cats)+5} canonical data categories supported; investigation engine connected.')
          PY
  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -R interface/. _site/
          touch _site/.nojekyll
          printf '%s\n' 'GEI Research Interface V1.0.9' > _site/DEPLOYMENT-VERSION.txt
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
