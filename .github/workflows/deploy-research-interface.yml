name: Deploy GEI Research Interface
on:
  push:
    branches: [main]
    paths:
      - 'interface/**'
      - 'data/**'
      - 'schema/**'
      - 'validation/**'
      - '.github/workflows/deploy-research-interface.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    name: Verify interface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install jsonschema
      - name: Validate canonical dataset
        run: python validation/validate.py
      - name: Verify V1.0.13 provenance drift and integrity attestation
        run: |
          test -f interface/index.html
          test -f interface/provenance-engine.js
          test -f interface/integrity-engine.js
          test -f schema/provenance.schema.json
          test -f schema/attestation.schema.json
          test -f data/provenance/PRV-GEI-V1013-001.json
          test -f data/attestations/ATT-GEI-V1013-001.json
          grep -q 'integrity-engine.js' interface/index.html
          grep -q 'Provenance Drift Detection' interface/integrity-engine.js
          grep -q 'canonicalize' interface/integrity-engine.js
          grep -q 'SHA-256' interface/integrity-engine.js
          grep -q 'record_digests' schema/provenance.schema.json
          grep -q 'attestation_status' schema/attestation.schema.json
          python - <<'PY'
          import hashlib,json,pathlib
          def canon(o): return json.dumps(o,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          p=json.loads(pathlib.Path('data/provenance/PRV-GEI-V1013-001.json').read_text())
          a=json.loads(pathlib.Path('data/attestations/ATT-GEI-V1013-001.json').read_text())
          if p.get('verification_status')!='verified': raise SystemExit('V1.0.13 provenance baseline is not verified')
          if p.get('digest_algorithm')!='SHA-256' or p.get('digest_scope')!='canonical_json': raise SystemExit('Invalid V1.0.13 digest configuration')
          if a.get('attestation_status')!='pass': raise SystemExit('V1.0.13 attestation is not PASS')
          if a.get('drifted_record_ids'): raise SystemExit('V1.0.13 attestation contains drifted records')
          for rid,expected in a['expected_digests'].items():
              if expected!=a['observed_digests'].get(rid): raise SystemExit(f'Attestation digest mismatch: {rid}')
              path=next(pathlib.Path('data').rglob(f'{rid}.json'),None)
              if not path: raise SystemExit(f'Missing attested record: {rid}')
              observed=hashlib.sha256(canon(json.loads(path.read_text()))).hexdigest()
              if observed!=expected: raise SystemExit(f'Live digest mismatch: {rid}')
          print('V1.0.13 provenance drift and integrity attestation verification passed.')
          PY
  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -R interface/. _site/
          touch _site/.nojekyll
          printf '%s\n' 'GEI Research Interface V1.0.13' > _site/DEPLOYMENT-VERSION.txt
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
