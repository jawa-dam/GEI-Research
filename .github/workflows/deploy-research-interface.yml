name: Deploy GEI Research Interface
on:
  push:
    branches: [main]
    paths:
      - 'interface/**'
      - 'data/**'
      - 'schema/**'
      - 'validation/**'
      - 'research/**'
      - '.github/workflows/deploy-research-interface.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    name: Verify interface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install jsonschema
      - name: Validate canonical dataset
        run: python validation/validate.py
      - name: Verify V1.0.14 immutable ledger and chain of custody
        run: |
          test -f interface/index.html
          test -f interface/provenance-engine.js
          test -f interface/integrity-engine.js
          test -f schema/ledger.schema.json
          test -f data/ledgers/LED-GEI-V1014-001.json
          grep -q 'V1.0.14' interface/integrity-engine.js
          grep -q 'Chain of Custody' interface/integrity-engine.js
          grep -q 'tamper' interface/integrity-engine.js
          grep -q 'ledger' schema/ledger.schema.json
          python - <<'PY'
          import hashlib,json,pathlib
          def canon(o): return json.dumps(o,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          l=json.loads(pathlib.Path('data/ledgers/LED-GEI-V1014-001.json').read_text())
          p=json.loads(pathlib.Path('data/provenance/PRV-GEI-V1013-001.json').read_text())
          if l.get('ledger_status')!='intact': raise SystemExit('V1.0.14 ledger is not marked intact')
          if p.get('verification_status')!='verified': raise SystemExit('V1.0.13 baseline provenance is not verified')
          for s in l.get('chain',[]):
              path=pathlib.Path('data')/(''.join([next((d.name for d in pathlib.Path('data').iterdir() if d.is_dir() and any(x.name==s['record_id']+'.json' for x in d.glob('*.json'))),''),'/'+s['record_id']+'.json']))
              candidates=list(pathlib.Path('data').rglob(s['record_id']+'.json'))
              if not candidates: raise SystemExit(f'Missing ledger record: {s["record_id"]}')
              observed=hashlib.sha256(canon(json.loads(candidates[0].read_text()))).hexdigest()
              if observed!=s['content_digest']: raise SystemExit(f'Ledger digest mismatch: {s["record_id"]}')
          print('V1.0.14 immutable ledger and chain-of-custody verification passed.')
          PY
  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -R interface/. _site/
          touch _site/.nojekyll
          printf '%s\n' 'GEI Research Interface V1.0.14' > _site/DEPLOYMENT-VERSION.txt
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
