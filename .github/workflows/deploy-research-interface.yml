name: Deploy GEI Research Interface
on:
  push:
    branches: [main]
    paths:
      - 'interface/**'
      - 'data/**'
      - 'schema/**'
      - 'validation/**'
      - '.github/workflows/deploy-research-interface.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    name: Verify interface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install jsonschema
      - name: Validate canonical dataset
        run: python validation/validate.py
      - name: Verify V1.0.12 provenance intelligence and audit trail
        run: |
          test -f interface/index.html
          test -f interface/styles.css
          test -f interface/app.js
          test -f interface/investigation.js
          test -f interface/decision-engine.js
          test -f interface/outcome-engine.js
          test -f interface/provenance-engine.js
          test -f schema/provenance.schema.json
          test -f schema/audit.schema.json
          test -f data/provenance/PRV-GEI-V1012-001.json
          test -f data/audits/AUD-GEI-V1012-001.json
          grep -q 'outcome-engine.js' interface/index.html
          grep -q 'provenance-engine.js' interface/index.html
          grep -q 'Provenance Intelligence & Audit Trail' interface/provenance-engine.js
          grep -q 'runAudit' interface/provenance-engine.js
          grep -q 'verification_status' interface/provenance-engine.js
          grep -q 'record_ids' interface/provenance-engine.js
          python - <<'PY'
          import pathlib,re,json
          html=pathlib.Path('interface/index.html').read_text(encoding='utf-8')
          js=pathlib.Path('interface/app.js').read_text(encoding='utf-8')
          out=pathlib.Path('interface/outcome-engine.js').read_text(encoding='utf-8')
          prov=pathlib.Path('interface/provenance-engine.js').read_text(encoding='utf-8')
          required=['explorerView','timelineView','comparisonsView','epistemicView','graphView','intelligenceView','investigationsView','decisionsView','recordDialog']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit(f'Missing interface elements: {missing}')
          for script in ['outcome-engine.js','provenance-engine.js']:
              if script not in html: raise SystemExit(f'{script} is not connected')
          m=re.search(r"const CATEGORIES=\[(.*?)\];",js,re.S)
          if not m: raise SystemExit('Could not find dataset category registry in app.js')
          cats=re.findall(r"'([^']+)'",m.group(1))
          required_dirs=set(cats)|{'questions','claims','investigations','results','outcomes','evaluations','decisions','executions','observations','provenance','audits'}
          missing_dirs=[c for c in sorted(required_dirs) if not pathlib.Path('data',c).is_dir()]
          if missing_dirs: raise SystemExit(f'Missing canonical data directories: {missing_dirs}')
          for f in ['question.schema.json','claim.schema.json','investigation.schema.json','result.schema.json','outcome.schema.json','decision.schema.json','execution.schema.json','observation.schema.json','evaluation.schema.json','provenance.schema.json','audit.schema.json']:
              if not pathlib.Path('schema',f).is_file(): raise SystemExit(f'Missing schema: {f}')
          for token in ['outcome_ids','result_ids','hypothesis_ids','assessment','expected_state','observed_state','delta','revision_recommendation']:
              if token not in out: raise SystemExit(f'Missing outcome intelligence field: {token}')
          for token in ['event_type','record_ids','reason','actor','timestamp','verification_status']:
              if token not in prov: raise SystemExit(f'Missing provenance field: {token}')
          for token in ['audit_scope','audit_status','audited_record_ids','checks','summary','epistemic_firewall']:
              audit_text=pathlib.Path('data/audits/AUD-GEI-V1012-001.json').read_text(encoding='utf-8')
              if token not in audit_text: raise SystemExit(f'Missing audit field: {token}')
          p=json.loads(pathlib.Path('data/provenance/PRV-GEI-V1012-001.json').read_text(encoding='utf-8'))
          a=json.loads(pathlib.Path('data/audits/AUD-GEI-V1012-001.json').read_text(encoding='utf-8'))
          if p.get('verification_status')!='verified': raise SystemExit('Baseline provenance record is not verified')
          if not p.get('record_ids'): raise SystemExit('Baseline provenance record has no target records')
          if a.get('audit_status')=='fail': raise SystemExit('Baseline audit is marked fail')
          if a.get('summary',{}).get('failed',0)!=0: raise SystemExit('Baseline audit contains failed checks')
          print('V1.0.12 provenance intelligence and audit trail verification passed.')
          PY
  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -R interface/. _site/
          touch _site/.nojekyll
          printf '%s\n' 'GEI Research Interface V1.0.12' > _site/DEPLOYMENT-VERSION.txt
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
