name: Validate GEI Research Dataset

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate canonical research dataset
        run: |
          mkdir -p /tmp/gei-v1017-consensus
          mv data/consensus/*.json /tmp/gei-v1017-consensus/
          python validation/validate.py
          mv /tmp/gei-v1017-consensus/*.json data/consensus/

      - name: Validate V1.0.17 consensus layer
        run: python validation/validate_v1017_consensus.py
