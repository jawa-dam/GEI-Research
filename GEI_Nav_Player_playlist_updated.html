<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEI Nav Player</title>
<style>
  @property --ang {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* ================= LAYOUT ================= */
  .bar {
    position: relative;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 5%;
    min-height: 96px;
    gap: 16px;
  }
  #fx-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: visible;
    z-index: 5;
  }

  /* ================= NAV BUTTONS ================= */
  .nav-wrap {
    flex: 0 0 auto;
    display: inline-block;
    transform-style: preserve-3d;
    transition: transform 0.2s ease;
  }
  .nav-btn {
    --a: #1e3a8a; --b: #3b82f6; --c: #93c5fd;
    --text: #ffffff; --glow: rgba(59,130,246,0.75);
    position: relative;
    isolation: isolate;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 28px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-decoration: none;
    border-radius: 999px;
    border: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    color: var(--text);
    background: linear-gradient(135deg, var(--a), var(--b));
    transition: transform 0.25s ease, box-shadow 0.3s ease, color 0.3s ease;
  }
  .nav-btn .label { position: relative; z-index: 2; }
  .nav-btn:hover  { transform: translateY(-2px) scale(1.04); }
  .nav-btn:active { transform: translateY(0) scale(0.97); }

  /* ---- 1. Solid glow ---- */
  .fx-glow { box-shadow: 0 0 14px 2px var(--glow); }
  .fx-glow:hover { box-shadow: 0 0 26px 7px var(--glow); }

  /* ---- 2. Pulse ---- */
  @keyframes navPulse {
    0%, 100% { box-shadow: 0 0 6px 1px var(--glow); }
    50%      { box-shadow: 0 0 22px 7px var(--glow); }
  }
  .fx-pulse { animation: navPulse 1.8s ease-in-out infinite; }

  /* ---- 3. Gradient shift ---- */
  @keyframes navGradientShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  .fx-gradient {
    background: linear-gradient(135deg, var(--a), var(--b), var(--c), var(--a));
    background-size: 300% 300%;
    animation: navGradientShift 4s ease infinite;
  }

  /* ---- 4. Neon outline (transparent) ---- */
  .fx-neon {
    background: transparent;
    border-color: var(--b);
    color: var(--b);
    text-shadow: 0 0 6px var(--glow);
    box-shadow: 0 0 10px 1px var(--glow), inset 0 0 8px var(--glow);
  }
  .fx-neon:hover { box-shadow: 0 0 20px 4px var(--glow), inset 0 0 12px var(--glow); }

  /* ---- 5. Shimmer sweep ---- */
  .fx-shimmer::after {
    content: "";
    position: absolute;
    top: 0; left: -75%;
    width: 50%; height: 100%;
    z-index: 1;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-20deg);
    animation: navShimmer 2.6s ease-in-out infinite;
  }
  @keyframes navShimmer {
    0%   { left: -75%; }
    100% { left: 125%; }
  }

  /* ---- 6. Frosted glass (transparent) ---- */
  .fx-glass {
    background: linear-gradient(135deg, rgba(255,255,255,0.20), rgba(255,255,255,0.04));
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 1px solid var(--glow);
    color: var(--b);
    box-shadow: 0 4px 18px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .fx-glass:hover { box-shadow: 0 4px 22px var(--glow), inset 0 1px 0 rgba(255,255,255,0.5); }

  /* ---- 7. Spinning rainbow border (transparent) ---- */
  .fx-rainbow { background: transparent; color: var(--b); border-color: transparent; }
  .fx-rainbow::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: inherit;
    padding: 3px;
    background: conic-gradient(from var(--ang), var(--a), var(--b), var(--c), var(--b), var(--a));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    animation: navSpin 3s linear infinite;
    z-index: 1;
  }
  @keyframes navSpin { to { --ang: 360deg; } }

  /* ---- 8. Neon flicker (transparent) ---- */
  .fx-flicker {
    background: transparent;
    border-color: var(--b);
    color: var(--b);
    animation: navFlicker 3.4s linear infinite;
  }
  @keyframes navFlicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% {
      text-shadow: 0 0 4px var(--glow), 0 0 12px var(--glow);
      box-shadow: 0 0 12px 2px var(--glow), inset 0 0 8px var(--glow);
      opacity: 1;
    }
    20%, 24%, 55% {
      text-shadow: none;
      box-shadow: none;
      opacity: 0.55;
    }
  }

  /* ---- 9. Aurora swirl ---- */
  .fx-aurora { background: var(--a); }
  .fx-aurora::before {
    content: "";
    position: absolute;
    inset: -60%;
    z-index: -1;
    background:
      radial-gradient(circle at 30% 30%, var(--b), transparent 40%),
      radial-gradient(circle at 70% 60%, var(--c), transparent 40%),
      radial-gradient(circle at 45% 90%, var(--glow), transparent 45%);
    filter: blur(6px);
    animation: navAurora 6s linear infinite;
  }
  @keyframes navAurora { to { transform: rotate(360deg); } }

  /* ---- 10. Ghost fill sweep (transparent until hover) ---- */
  .fx-fill {
    background: transparent;
    border-color: var(--b);
    color: var(--b);
  }
  .fx-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(135deg, var(--a), var(--b));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.35s ease;
  }
  .fx-fill:hover { color: var(--text); box-shadow: 0 0 16px 3px var(--glow); }
  .fx-fill:hover::after { transform: scaleX(1); }

  /* ---- 11. Glitch (transparent) ---- */
  .fx-glitch {
    background: transparent;
    border-color: var(--b);
    color: var(--b);
    box-shadow: 0 0 8px var(--glow);
    animation: navGlitch 2.8s steps(1) infinite;
  }
  @keyframes navGlitch {
    0%, 86%, 100% { text-shadow: none; }
    88% { text-shadow: -2px 0 var(--c), 2px 0 var(--a); }
    90% { text-shadow: 2px -1px var(--c), -2px 1px var(--a); }
    92% { text-shadow: -1px 1px var(--a), 1px -1px var(--c); }
    94% { text-shadow: 3px 0 var(--c), -3px 0 var(--a); }
  }

  /* ---- 12. Sparkle (JS spawns stars around it) ---- */
  .fx-sparkle { box-shadow: 0 0 10px var(--glow); }

  /* ---- Ripple on click (all buttons) ---- */
  .ripple {
    position: absolute;
    border-radius: 50%;
    width: 20px; height: 20px;
    margin: -10px 0 0 -10px;
    background: rgba(255,255,255,0.5);
    pointer-events: none;
    z-index: 1;
    animation: navRipple 0.6s ease-out forwards;
  }
  @keyframes navRipple {
    from { transform: scale(0); opacity: 0.8; }
    to   { transform: scale(12); opacity: 0; }
  }

  /* ================= MOTION MODIFIERS (on wrapper) ================= */
  .m-float { animation: mFloat 3.2s ease-in-out infinite; }
  @keyframes mFloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }

  .m-breathe { animation: mBreathe 3s ease-in-out infinite; }
  @keyframes mBreathe { 0%, 100% { scale: 1; } 50% { scale: 1.05; } }

  .m-wiggle { animation: mWiggle 4s ease-in-out infinite; }
  @keyframes mWiggle {
    0%, 80%, 100% { rotate: 0deg; }
    84% { rotate: -4deg; } 88% { rotate: 4deg; }
    92% { rotate: -2deg; } 96% { rotate: 2deg; }
  }

  .m-heartbeat { animation: mHeartbeat 2.4s ease-in-out infinite; }
  @keyframes mHeartbeat {
    0%, 40%, 100% { scale: 1; }
    10% { scale: 1.08; } 20% { scale: 1; } 30% { scale: 1.05; }
  }

  .m-bounce { animation: mBounce 3.6s ease infinite; }
  @keyframes mBounce {
    0%, 70%, 100% { translate: 0 0; }
    76% { translate: 0 -8px; } 82% { translate: 0 0; }
    87% { translate: 0 -3px; } 92% { translate: 0 0; }
  }

  /* ================= PARTICLES ================= */
  .spark {
    position: absolute;
    width: 9px; height: 9px;
    clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
    pointer-events: none;
    animation: sparkRise 1s ease-out forwards;
  }
  @keyframes sparkRise {
    0%   { transform: translate(0,0) scale(0) rotate(0deg); opacity: 0; }
    30%  { transform: translate(var(--dx), calc(var(--dy) * 0.4)) scale(1) rotate(90deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2) rotate(180deg); opacity: 0; }
  }
  .burst {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    pointer-events: none;
    animation: burstOut 0.7s ease-out forwards;
  }
  @keyframes burstOut {
    from { transform: translate(0,0) scale(1); opacity: 1; }
    to   { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; }
  }

  /* ================= MUSIC PLAYER (center) ================= */
  #stage {
    position: relative;
    flex: 1 1 auto;
    min-width: 76px;
    max-width: 420px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  #play-btn {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff6ec4, #7873f5 55%, #4ADEDE 100%);
    box-shadow: 0 4px 18px rgba(0,0,0,0.25), 0 0 0 4px rgba(255,255,255,0.08) inset;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.35s ease;
    z-index: 2;
  }
  #play-btn:hover { transform: scale(1.06); }
  #play-btn.hidden { transform: scale(0.2); opacity: 0; pointer-events: none; }
  #play-icon {
    width: 0; height: 0;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-left: 20px solid #fff;
    margin-left: 4px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
  }
  #idle-ring {
    position: absolute;
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35);
    animation: ringPulse 2.6s ease-out infinite;
    z-index: 1;
  }
  #idle-ring.hidden { display: none; }
  @keyframes ringPulse {
    0%   { transform: scale(1);   opacity: 0.6; }
    70%  { transform: scale(1.9); opacity: 0; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  #viz {
    position: absolute;
    width: 100%; height: 100%;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.4s ease, transform 0.45s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
  }
  #viz.visible { opacity: 1; transform: scale(1); }
  #loading-hint {
    position: absolute;
    bottom: -2px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 10px;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.55);
    opacity: 0;
    transition: opacity 0.3s ease;
    white-space: nowrap;
  }
  #loading-hint.show { opacity: 1; }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 480px) {
    .bar { gap: 10px; padding: 8px 4%; }
    .nav-btn { padding: 10px 16px; font-size: 14px; }
    #stage { min-width: 64px; }
  }
  @media (max-width: 340px) {
    .nav-btn { padding: 8px 12px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div class="bar" id="bar">
  <span class="nav-wrap" id="wrap-left">
    <a id="btn-left" class="nav-btn" href="https://gei-mountain-ocean.vercel.app/" target="_blank" rel="noopener noreferrer"><span class="label">GAME</span></a>
  </span>

  <div id="stage" role="button" aria-label="Play or pause music">
    <div id="idle-ring"></div>
    <div id="play-btn"><div id="play-icon"></div></div>
    <canvas id="viz"></canvas>
    <div id="loading-hint">loading…</div>
  </div>

  <span class="nav-wrap" id="wrap-right">
    <a id="btn-right" class="nav-btn" href="https://jawa-dam.github.io/yalltoo/" target="_blank" rel="noopener noreferrer"><span class="label">LEARN</span></a>
  </span>

  <div id="fx-layer"></div>
</div>

<audio id="audio" preload="auto" crossorigin="anonymous"></audio>

<script>
/* =================================================================
   PART 1 — NAV BUTTONS (random palette + effect + motion per load)
================================================================= */
(function () {
  var palettes = [
    { a: "#1e3a8a", b: "#3b82f6", c: "#93c5fd", text: "#ffffff", glow: "rgba(59,130,246,0.75)" },  // blues
    { a: "#065f46", b: "#10b981", c: "#6ee7b7", text: "#ffffff", glow: "rgba(16,185,129,0.75)" },  // greens
    { a: "#7c2d12", b: "#f97316", c: "#fdba74", text: "#ffffff", glow: "rgba(249,115,22,0.75)" },  // oranges
    { a: "#581c87", b: "#a855f7", c: "#d8b4fe", text: "#ffffff", glow: "rgba(168,85,247,0.75)" },  // purples
    { a: "#7f1d1d", b: "#ef4444", c: "#fca5a5", text: "#ffffff", glow: "rgba(239,68,68,0.75)" },   // reds
    { a: "#0e7490", b: "#22d3ee", c: "#a5f3fc", text: "#062f36", glow: "rgba(34,211,238,0.75)" },  // cyans
    { a: "#a16207", b: "#facc15", c: "#fef08a", text: "#3a2c00", glow: "rgba(250,204,21,0.75)" },  // golds
    { a: "#831843", b: "#ec4899", c: "#f9a8d4", text: "#ffffff", glow: "rgba(236,72,153,0.75)" },  // pinks
    { a: "#1f2937", b: "#9ca3af", c: "#e5e7eb", text: "#ffffff", glow: "rgba(156,163,175,0.7)" },  // slate
    { a: "#134e4a", b: "#2dd4bf", c: "#99f6e4", text: "#012a26", glow: "rgba(45,212,191,0.75)" },  // teals
    { a: "#312e81", b: "#6366f1", c: "#c7d2fe", text: "#ffffff", glow: "rgba(99,102,241,0.75)" },  // indigo
    { a: "#3f6212", b: "#84cc16", c: "#d9f99d", text: "#1a2e05", glow: "rgba(132,204,22,0.75)" },  // lime
    { a: "#881337", b: "#f43f5e", c: "#fda4af", text: "#ffffff", glow: "rgba(244,63,94,0.75)" },   // rose
    { a: "#9a3412", b: "#dc2626", c: "#f59e0b", text: "#ffffff", glow: "rgba(220,38,38,0.7)" },    // red clay
    { a: "#7c2d12", b: "#ec4899", c: "#facc15", text: "#ffffff", glow: "rgba(236,72,153,0.7)" },   // sunset
    { a: "#0c4a6e", b: "#0ea5e9", c: "#2dd4bf", text: "#ffffff", glow: "rgba(14,165,233,0.75)" }   // deep ocean
  ];

  var effects = [
    "fx-glow", "fx-pulse", "fx-gradient", "fx-neon", "fx-shimmer", "fx-glass",
    "fx-rainbow", "fx-flicker", "fx-aurora", "fx-fill", "fx-glitch", "fx-sparkle"
  ];
  // Empty strings = chance of no extra motion
  var motions = ["", "", "m-float", "m-breathe", "m-wiggle", "m-heartbeat", "m-bounce", "m-tilt"];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var bar = document.getElementById("bar");
  var layer = document.getElementById("fx-layer");

  function spawnSpark(btn, color) {
    var br = bar.getBoundingClientRect();
    var r = btn.getBoundingClientRect();
    var s = document.createElement("div");
    s.className = "spark";
    var x = r.left - br.left + Math.random() * r.width;
    var y = r.top - br.top + (Math.random() < 0.5 ? -2 : r.height - 6) + (Math.random() * 10 - 5);
    s.style.left = x + "px";
    s.style.top = y + "px";
    s.style.background = color;
    s.style.filter = "drop-shadow(0 0 3px " + color + ")";
    s.style.setProperty("--dx", (Math.random() * 16 - 8) + "px");
    s.style.setProperty("--dy", (-10 - Math.random() * 14) + "px");
    layer.appendChild(s);
    s.addEventListener("animationend", function () { s.remove(); });
  }

  function burst(btn, colors) {
    var br = bar.getBoundingClientRect();
    var r = btn.getBoundingClientRect();
    var cx = r.left - br.left + r.width / 2;
    var cy = r.top - br.top + r.height / 2;
    for (var i = 0; i < 14; i++) {
      var d = document.createElement("div");
      d.className = "burst";
      var ang = (i / 14) * Math.PI * 2 + Math.random() * 0.4;
      var dist = 30 + Math.random() * 30;
      d.style.left = cx + "px";
      d.style.top = cy + "px";
      d.style.background = colors[i % colors.length];
      d.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      d.style.setProperty("--dy", Math.sin(ang) * dist * 0.6 + "px");
      layer.appendChild(d);
      d.addEventListener("animationend", function () { this.remove(); });
    }
  }
  window.__geiBurst = burst; // shared with the music player

  function addRipple(btn) {
    btn.addEventListener("pointerdown", function (e) {
      var r = btn.getBoundingClientRect();
      var rp = document.createElement("span");
      rp.className = "ripple";
      rp.style.left = (e.clientX - r.left) + "px";
      rp.style.top = (e.clientY - r.top) + "px";
      btn.appendChild(rp);
      rp.addEventListener("animationend", function () { rp.remove(); });
    });
  }

  function addTilt(wrap) {
    wrap.addEventListener("pointermove", function (e) {
      var r = wrap.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - 0.5;
      var py = (e.clientY - r.top) / r.height - 0.5;
      wrap.style.transform = "perspective(400px) rotateY(" + (px * 18) + "deg) rotateX(" + (-py * 18) + "deg)";
    });
    wrap.addEventListener("pointerleave", function () { wrap.style.transform = ""; });
  }

  function styleButton(btn, wrap, palette, effect, motion) {
    btn.style.setProperty("--a", palette.a);
    btn.style.setProperty("--b", palette.b);
    btn.style.setProperty("--c", palette.c);
    btn.style.setProperty("--text", palette.text);
    btn.style.setProperty("--glow", palette.glow);
    btn.classList.add(effect);

    if (motion === "m-tilt") addTilt(wrap);
    else if (motion) wrap.classList.add(motion);

    addRipple(btn);
    btn.addEventListener("click", function () { burst(btn, [palette.a, palette.b, palette.c]); });

    if (effect === "fx-sparkle") {
      var colors = [palette.b, palette.c, "#ffffff"];
      setInterval(function () {
        if (!document.hidden) spawnSpark(btn, pick(colors));
      }, 240);
    }
  }

  // Two different palettes and two different effects for the pair
  var pals = shuffle(palettes);
  var fxs = shuffle(effects);
  styleButton(document.getElementById("btn-left"),  document.getElementById("wrap-left"),  pals[0], fxs[0], pick(motions));
  styleButton(document.getElementById("btn-right"), document.getElementById("wrap-right"), pals[1], fxs[1], pick(motions));
})();

/* =================================================================
   PART 2 — MUSIC PLAYER (center button + visualizer)
   Endless random rotation: when a song ends the next one is chosen
   at random (no repeats until every song has played), and when the
   whole list is exhausted it reshuffles and keeps looping forever.
================================================================= */
(function () {
  /* HIDDEN PLAYLIST — not rendered in the UI, used only to pick one track. */
  const PLAYLIST = [
    { title: "Heaven Is A Dam", artist: "Wilbert Bouie Jr.", src: "https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/heaven-is-a-dam-by-wilbert-bouie-jr-qly1FH80DLLHuYZP.mp3" },
    { title: "The Master's Build", artist: "Y'all Too", src: "https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/the_maker_s_blueprint-pQPS2KhHLu40bkMw.mp3" },
    { title: "Scooped From Red Clay", artist: "Y'all Too", src: "https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/scooped_from_red_clay-cp5MYH0Sn0PTPcl4.mp3" },
    { title: "Adam the Dam (Remix)", artist: "Y'all Too", src: "https://assets.zyrosite.com/YZ9jg46Bljs5wOZR/adam_the_dam-2-40oMmbqZQpFB6AXR.mp3" },

  /* NO-REPEAT SHUFFLE (per browser session)
     Picks a random unused index; when every index has been used the
     history resets and a fresh random pass begins — so the rotation
     loops forever without repeating a song before the whole list has
     played. `avoidIndex` prevents the same song twice in a row when a
     new pass starts. */
  const PLAYED_SONGS_KEY  = 'gei_played_song_indices';
  const PLAYED_VIZ_KEY    = 'gei_played_viz_styles';
  const PLAYED_THEME_KEY  = 'gei_played_viz_themes';
  function pickWithoutRepeat(poolSize, storageKey, avoidIndex) {
    let played = [];
    try { played = JSON.parse(sessionStorage.getItem(storageKey) || '[]'); } catch (e) { played = []; }
    played = played.filter(i => i < poolSize);
    let available = [];
    for (let i = 0; i < poolSize; i++) if (!played.includes(i)) available.push(i);
    if (available.length === 0) { played = []; available = Array.from({ length: poolSize }, (_, i) => i); }
    if (available.length > 1 && avoidIndex != null) {
      available = available.filter(i => i !== avoidIndex);
    }
    const choice = available[Math.floor(Math.random() * available.length)];
    played.push(choice);
    try { sessionStorage.setItem(storageKey, JSON.stringify(played)); } catch (e) {}
    return choice;
  }

  const stage    = document.getElementById('stage');
  const playBtn  = document.getElementById('play-btn');
  const idleRing = document.getElementById('idle-ring');
  const canvas   = document.getElementById('viz');
  const audio    = document.getElementById('audio');
  const hint     = document.getElementById('loading-hint');
  const ctx2d    = canvas.getContext('2d');

  let currentTrackIndex = -1;
  function pickNextIndex() {
    return pickWithoutRepeat(PLAYLIST.length, PLAYED_SONGS_KEY, currentTrackIndex >= 0 ? currentTrackIndex : null);
  }
  function loadTrack(index) {
    currentTrackIndex = index;
    audio.src = PLAYLIST[index].src;
    try { audio.load(); } catch (e) {}
  }
  /* Pre-load the first random pick (actual playback waits for the user click). */
  loadTrack(pickNextIndex());

  /* RANDOM COLOR THEME for the play orb + visualizer */
  const VIZ_THEMES = [
    ['#ff6ec4', '#ffd36e', '#6effc4', '#4ADEDE', '#7873f5', '#ff8a5c'], // original candy
    ['#22d3ee', '#3b82f6', '#a5f3fc', '#2dd4bf', '#6366f1', '#0ea5e9'], // ocean
    ['#f97316', '#facc15', '#fb7185', '#f59e0b', '#ec4899', '#ef4444'], // sunset
    ['#dc2626', '#f59e0b', '#fde68a', '#ef4444', '#92400e', '#b45309'], // red clay
    ['#10b981', '#84cc16', '#22d3ee', '#2dd4bf', '#a855f7', '#6366f1'], // aurora
    ['#f0abfc', '#fde047', '#a3e635', '#67e8f9', '#818cf8', '#f472b6']  // neon pastel
  ];
  const palette = VIZ_THEMES[pickWithoutRepeat(VIZ_THEMES.length, PLAYED_THEME_KEY)];
  playBtn.style.background = `radial-gradient(circle at 35% 30%, ${palette[0]}, ${palette[4]} 55%, ${palette[3]} 100%)`;
  idleRing.style.borderColor = palette[3];

  let audioCtx, analyser, sourceNode, dataArray, bufferLength;
  let usingRealData = false;
  let realDataProbeCount = 0;
  let isPlaying = false;
  let rafId = null;
  let t = 0;

  /* Endless-rotation state */
  let wantMusic = false;  // the listener wants playback to keep going
  let advancing = false;  // a track swap / auto-play chain is in flight
  let playGen = 0;        // supersedes stale play() results

  function resizeCanvas() {
    const rect = stage.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.max(1, rect.width  * dpr);
    canvas.height = Math.max(1, rect.height * dpr);
    canvas.style.width  = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function setupAudioGraph() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      sourceNode = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      analyser.smoothingTimeConstant = 0.82;
      bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
    } catch (e) {
      audioCtx = null;
    }
  }

  function hexToRgb(hex) {
    const v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }
  function lerpColor(c1, c2, f) {
    return [
      Math.round(c1[0] + (c2[0] - c1[0]) * f),
      Math.round(c1[1] + (c2[1] - c1[1]) * f),
      Math.round(c1[2] + (c2[2] - c1[2]) * f)
    ];
  }
  function colorAt(pos) {
    pos = ((pos % 1) + 1) % 1;
    const idx = pos * palette.length;
    const i0 = Math.floor(idx) % palette.length;
    const i1 = (i0 + 1) % palette.length;
    const f = idx - Math.floor(idx);
    const c = lerpColor(hexToRgb(palette[i0]), hexToRgb(palette[i1]), f);
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }

  function getLevels(barCount) {
    const levels = new Array(barCount);
    if (analyser) {
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
      if (sum > 40) { usingRealData = true; realDataProbeCount = 0; }
      else if (usingRealData) {
        realDataProbeCount++;
        if (realDataProbeCount > 90) usingRealData = false;
      }
    }
    if (usingRealData && dataArray) {
      const step = bufferLength / barCount;
      for (let i = 0; i < barCount; i++) levels[i] = dataArray[Math.floor(i * step)] / 255;
    } else {
      for (let i = 0; i < barCount; i++) {
        const a = Math.sin(t * 2.2 + i * 0.7) * 0.5 + 0.5;
        const b = Math.sin(t * 3.7 - i * 0.4) * 0.5 + 0.5;
        const c = Math.sin(t * 1.3 + i * 1.1) * 0.5 + 0.5;
        levels[i] = Math.max(0.08, (a * 0.5 + b * 0.3 + c * 0.2));
      }
    }
    return levels;
  }

  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  /* VISUALIZATION PACK — one chosen at random (no-repeat per session) */
  function drawBars(c, w, h) {
    const barCount = Math.max(16, Math.min(56, Math.floor(w / 12)));
    const levels = getLevels(barCount);
    const gap = 4;
    const barWidth = (w - gap * (barCount - 1)) / barCount;
    const maxBarHeight = h * 0.82;
    const baseline = h / 2;
    const phase = (t * 0.05) % 1;
    for (let i = 0; i < barCount; i++) {
      const barH = Math.max(4, levels[i] * maxBarHeight);
      const x = i * (barWidth + gap);
      const y = baseline - barH / 2;
      const color = colorAt(i / barCount + phase);
      roundRect(c, x, y, barWidth, barH, Math.min(barWidth / 2, 6));
      c.fillStyle = color;
      c.shadowColor = color;
      c.shadowBlur = 8;
      c.fill();
    }
    c.shadowBlur = 0;
  }

  function drawRadial(c, w, h) {
    const cx = w / 2, cy = h / 2;
    const barCount = 40;
    const levels = getLevels(barCount);
    const innerR = h * 0.16;
    const maxLen = h * 0.42;
    const rotation = t * 0.35;
    const phase = (t * 0.06) % 1;
    for (let i = 0; i < barCount; i++) {
      const ang = rotation + (i / barCount) * Math.PI * 2;
      const len = innerR + Math.max(3, levels[i] * maxLen);
      const color = colorAt(i / barCount + phase);
      c.strokeStyle = color;
      c.shadowColor = color;
      c.shadowBlur = 6;
      c.lineWidth = Math.max(2, (w / barCount) * 0.35);
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(cx + Math.cos(ang) * innerR, cy + Math.sin(ang) * innerR * 0.55);
      c.lineTo(cx + Math.cos(ang) * len,    cy + Math.sin(ang) * len * 0.55);
      c.stroke();
    }
    c.shadowBlur = 0;
    const avg = levels.reduce((a, b) => a + b, 0) / levels.length;
    const coreR = innerR * (0.5 + avg * 0.6);
    const grad = c.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    grad.addColorStop(0, colorAt(phase + 0.5));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = grad;
    c.beginPath();
    c.ellipse(cx, cy, coreR, coreR * 0.6, 0, 0, Math.PI * 2);
    c.fill();
  }

  function drawWave(c, w, h) {
    const points = 48;
    const levels = getLevels(points);
    const midY = h / 2;
    const amp = h * 0.38;
    const phase = (t * 0.08) % 1;
    for (let layer = 0; layer < 3; layer++) {
      c.beginPath();
      const layerAmp = amp * (1 - layer * 0.28);
      const layerOffset = layer * 0.12;
      for (let i = 0; i <= points; i++) {
        const idx = Math.min(points - 1, i);
        const x = (i / points) * w;
        const wobble = Math.sin(t * 1.6 + i * 0.4 + layer) * 0.15;
        const lvl = (levels[idx] - 0.4 + wobble);
        const y = midY + lvl * layerAmp * (layer === 0 ? 1 : -1);
        if (i === 0) c.moveTo(x, y);
        else {
          const prevX = ((i - 1) / points) * w;
          c.quadraticCurveTo(prevX, y, (prevX + x) / 2, y);
        }
      }
      const grad = c.createLinearGradient(0, 0, w, 0);
      grad.addColorStop(0, colorAt(phase + layerOffset));
      grad.addColorStop(0.5, colorAt(phase + 0.33 + layerOffset));
      grad.addColorStop(1, colorAt(phase + 0.66 + layerOffset));
      c.strokeStyle = grad;
      c.shadowColor = colorAt(phase + layerOffset);
      c.shadowBlur = 10;
      c.lineWidth = layer === 0 ? 3 : 1.6;
      c.globalAlpha = layer === 0 ? 1 : 0.55;
      c.stroke();
    }
    c.globalAlpha = 1;
    c.shadowBlur = 0;
  }

  const particleSeeds = Array.from({ length: 26 }, (_, i) => ({
    baseX: Math.random(),
    baseY: 0.3 + Math.random() * 0.4,
    speed: 0.4 + Math.random() * 0.8,
    offset: Math.random() * Math.PI * 2,
    bin: i % 26
  }));
  function drawParticles(c, w, h) {
    const levels = getLevels(26);
    const phase = (t * 0.05) % 1;
    particleSeeds.forEach((p, i) => {
      const lvl = levels[p.bin];
      const x = p.baseX * w + Math.sin(t * p.speed + p.offset) * (w * 0.03);
      const y = p.baseY * h + Math.cos(t * p.speed * 1.3 + p.offset) * (h * 0.22);
      const color = colorAt(i / particleSeeds.length + phase);
      c.beginPath();
      c.fillStyle = color;
      c.shadowColor = color;
      c.shadowBlur = 10;
      c.globalAlpha = 0.55 + lvl * 0.45;
      c.arc(x, y, 2 + lvl * 10, 0, Math.PI * 2);
      c.fill();
    });
    c.globalAlpha = 1;
    c.shadowBlur = 0;
  }

  function drawRings(c, w, h) {
    const cx = w / 2, cy = h / 2;
    const levels = getLevels(24);
    const third = Math.floor(levels.length / 3);
    const bass   = levels.slice(0, third).reduce((a, b) => a + b, 0) / third;
    const mid    = levels.slice(third, third * 2).reduce((a, b) => a + b, 0) / third;
    const treble = levels.slice(third * 2).reduce((a, b) => a + b, 0) / (levels.length - third * 2);
    const phase = (t * 0.07) % 1;
    const maxR = Math.min(w, h * 2.2) * 0.46;
    [bass, mid, treble].forEach((val, i) => {
      const r = maxR * (0.35 + i * 0.28) * (0.7 + val * 0.5);
      const color = colorAt(phase + i / 3);
      c.beginPath();
      c.strokeStyle = color;
      c.shadowColor = color;
      c.shadowBlur = 10;
      c.lineWidth = 3 + val * 5;
      c.globalAlpha = 0.85 - i * 0.15;
      c.ellipse(cx, cy, r, r * 0.55, 0, 0, Math.PI * 2);
      c.stroke();
    });
    c.globalAlpha = 1;
    c.shadowBlur = 0;
  }

  /* mirrored spectrum — bass in the center, reflection below */
  function drawMirror(c, w, h) {
    const half = Math.max(8, Math.min(28, Math.floor(w / 24)));
    const levels = getLevels(half);
    const total = half * 2, gap = 3;
    const bw = (w - gap * (total - 1)) / total;
    const mid = h * 0.58;
    const phase = (t * 0.05) % 1;
    for (let i = 0; i < half; i++) {
      const bh = Math.max(3, levels[i] * h * 0.52);
      const color = colorAt(i / half + phase);
      c.fillStyle = color;
      c.shadowColor = color;
      c.shadowBlur = 8;
      [half - 1 - i, half + i].forEach(k => {
        const x = k * (bw + gap);
        c.globalAlpha = 1;
        roundRect(c, x, mid - bh, bw, bh, Math.min(bw / 2, 4)); c.fill();
        c.globalAlpha = 0.3;
        roundRect(c, x, mid + 3, bw, bh * 0.5, Math.min(bw / 2, 4)); c.fill();
      });
    }
    c.globalAlpha = 1;
    c.shadowBlur = 0;
  }

  /* LED dot-matrix equalizer */
  function drawDots(c, w, h) {
    const cols = Math.max(10, Math.min(40, Math.floor(w / 14)));
    const rows = 7;
    const levels = getLevels(cols);
    const cw = w / cols, rh = h / rows;
    const r = Math.min(cw, rh) * 0.3;
    const phase = (t * 0.05) % 1;
    for (let i = 0; i < cols; i++) {
      const lit = Math.round(levels[i] * rows);
      for (let j = 0; j < rows; j++) {
        const on = (rows - 1 - j) < lit;
        const color = colorAt(i / cols + phase + j * 0.03);
        c.globalAlpha = on ? 1 : 0.12;
        c.fillStyle = color;
        c.shadowColor = color;
        c.shadowBlur = on ? 8 : 0;
        c.beginPath();
        c.arc(i * cw + cw / 2, j * rh + rh / 2, r, 0, Math.PI * 2);
        c.fill();
      }
    }
    c.globalAlpha = 1;
    c.shadowBlur = 0;
  }

  /* orbiting planets around a pulsing core */
  function drawOrbit(c, w, h) {
    const cx = w / 2, cy = h / 2;
    const n = 18;
    const levels = getLevels(n);
    const phase = (t * 0.06) % 1;
    const rx = Math.min(w * 0.42, h * 1.8), ry = h * 0.34;
    c.globalAlpha = 0.25;
    c.strokeStyle = colorAt(phase);
    c.lineWidth = 1;
    c.beginPath();
    c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    c.stroke();
    const avg = levels.reduce((a, b) => a + b, 0) / n;
    const coreR = ry * (0.4 + avg * 0.7);
    const g = c.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    g.addColorStop(0, colorAt(phase + 0.5));
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.globalAlpha = 1;
    c.fillStyle = g;
    c.beginPath();
    c.arc(cx, cy, coreR, 0, Math.PI * 2);
    c.fill();
    for (let i = 0; i < n; i++) {
      const ang = t * 0.6 + (i / n) * Math.PI * 2;
      const depth = (Math.sin(ang) + 1) / 2;
      const color = colorAt(i / n + phase);
      c.fillStyle = color;
      c.shadowColor = color;
      c.shadowBlur = 10;
      c.globalAlpha = 0.45 + depth * 0.55;
      c.beginPath();
      c.arc(cx + Math.cos(ang) * rx, cy + Math.sin(ang) * ry, (2 + levels[i] * 8) * (0.6 + depth * 0.6), 0, Math.PI * 2);
      c.fill();
    }
    c.globalAlpha = 1;
    c.shadowBlur = 0;
  }

  const VIZ_DRAWERS = {
    bars: drawBars, radial: drawRadial, wave: drawWave, particles: drawParticles,
    rings: drawRings, mirror: drawMirror, dots: drawDots, orbit: drawOrbit
  };
  const VIZ_STYLES = Object.keys(VIZ_DRAWERS);
  const drawActiveViz = VIZ_DRAWERS[VIZ_STYLES[pickWithoutRepeat(VIZ_STYLES.length, PLAYED_VIZ_KEY)]];

  function draw() {
    rafId = requestAnimationFrame(draw);
    t += 0.045;
    const rect = stage.getBoundingClientRect();
    ctx2d.clearRect(0, 0, rect.width, rect.height);
    drawActiveViz(ctx2d, rect.width, rect.height);
  }

  function showVisualizer() {
    playBtn.classList.add('hidden');
    idleRing.classList.add('hidden');
    canvas.classList.add('visible');
    resizeCanvas();
    if (!rafId) draw();
  }
  function showPlayButton() {
    canvas.classList.remove('visible');
    playBtn.classList.remove('hidden');
    idleRing.classList.remove('hidden');
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    ctx2d.clearRect(0, 0, canvas.width, canvas.height);
  }

  /* Tries to start the current track. Returns null on success or the
     error on failure (UI is only updated on success). */
  async function play() {
    setupAudioGraph();
    if (audioCtx && audioCtx.state === 'suspended') {
      try { await audioCtx.resume(); } catch (e) {}
    }
    hint.classList.add('show');
    try {
      await audio.play();
      isPlaying = true;
      hint.classList.remove('show');
      showVisualizer();
      return null;
    } catch (e) {
      hint.classList.remove('show');
      isPlaying = false;
      return e;
    }
  }

  function pause() {
    wantMusic = false;
    playGen++;                 // supersede any in-flight play attempt
    audio.pause();
    isPlaying = false;
    showPlayButton();
  }

  /* Keeps the music alive forever: optionally jumps to a fresh random
     track first (auto=true), then plays — and if a track is broken it
     skips ahead instead of stalling. Used for the `ended` hand-off,
     mid-playback errors, and the user's play click. */
  async function startMusic(auto) {
    wantMusic = true;
    if (advancing) return;
    advancing = true;
    try {
      if (auto) loadTrack(pickNextIndex());
      for (let attempt = 0; attempt < 6 && wantMusic; attempt++) {
        const gen = ++playGen;
        if (attempt > 0) loadTrack(pickNextIndex());
        const err = await play();
        if (gen !== playGen) return;   // paused or superseded — bail quietly
        if (!err) return;              // smooth hand-off, music keeps going
        if (err.name === 'NotAllowedError') { wantMusic = false; showPlayButton(); return; }
        if (err.name === 'AbortError') {
          if (wantMusic) { wantMusic = false; showPlayButton(); }
          return;
        }
        /* NotSupportedError / load failure → loop and try another track */
      }
      wantMusic = false;
      showPlayButton();               // gave up after several bad tracks
    } finally {
      advancing = false;
    }
  }

  stage.addEventListener('click', function () {
    if (isPlaying) { pause(); return; }
    if (window.__geiBurst) window.__geiBurst(playBtn, palette);
    startMusic(false);
  });
  /* A song finished → straight into the next random one, forever. */
  audio.addEventListener('ended', function () {
    if (wantMusic) startMusic(true);
    else showPlayButton();
  });
  /* A file died mid-song (bad link, network drop) → skip to the next. */
  audio.addEventListener('error', function () {
    if (!wantMusic || advancing) return;
    isPlaying = false;
    startMusic(true);
  });
  /* External pause (media keys / OS controls) behaves like our pause —
     but a track reaching its natural end also fires a 'pause' event
     (per the HTML spec, right before 'ended'), and audio.ended is
     already true at that point. Ignore that case here so the
     'ended' handler is the one that decides to auto-advance; otherwise
     this listener would flip wantMusic off a beat too early and the
     rotation would stop after the very first song. */
  audio.addEventListener('pause', function () {
    if (audio.ended) return;
    if (isPlaying && !advancing) {
      wantMusic = false;
      isPlaying = false;
      showPlayButton();
    }
  });
})();
</script>
</body>
